# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-22.04
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # msigdbr downloads its gene-set database from Zenodo on first use. Keep that
      # download between runs (keyed on the msigdbr version) so the site build does
      # not depend on Zenodo being reachable every time.
      - name: Get msigdbr version
        id: msigdbr
        run: cat("version=", as.character(packageVersion("msigdbr")), "\n", sep = "", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Cache MSigDB gene sets
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/msigdbr
          key: msigdbr-${{ runner.os }}-${{ steps.msigdbr.outputs.version }}

      - name: Download MSigDB gene sets (with retries)
        continue-on-error: true
        run: |
          for (i in 1:5) {
            ok <- tryCatch({
              msigdbr::msigdbr(species = "Homo sapiens", collection = "H")
              TRUE
            }, error = function(e) {
              message("Attempt ", i, " failed: ", conditionMessage(e))
              FALSE
            })
            if (ok) break
            Sys.sleep(30 * i)
          }
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
